    <!-- Google Fonts.
         Was requesting 23 font files: Space Grotesk 300-700, Inter 100-900, and
         all nine weights of Outfit — which isn't referenced anywhere in the app.
         It also loaded the stylesheet with the preload/onload swap trick, so the
         font CSS wasn't even discovered until after first paint, which is what
         made every heading visibly change font mid-load. Now: only the two
         families actually in tailwind.config.ts, only the weights in use, and
         fetched in the critical path so the swap window is as short as possible. -->
    <!-- Self-hosted fonts. The Google Fonts stylesheet measured 796 ms of
         render-blocking time in Lighthouse, and cost two extra origins
         (googleapis + gstatic) of DNS + TLS before a single glyph arrived.
         The two faces above the fold are preloaded; unicode-range in
         fonts.css keeps the browser from fetching subsets it does not need. -->
    <link rel="preload" href="/fonts/SpaceGrotesk-700-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/Inter-400-latin.woff2" as="font" type="font/woff2" crossorigin>

  <body>
    <!--
      Netlify Forms detection stub.

      Netlify's build bot scans the deployed HTML for forms; it never executes
      JavaScript, so a form that only exists inside the React bundle is invisible
      to it and every POST comes back 404. This hidden copy is what registers the
      form and its field names at deploy time. The real, styled form is the React
      one, which POSTs to it.

      Why this exists at all: the contact form used to run through a Supabase
      edge function, and Supabase's free tier paused the project after ~7 days
      idle. A paused project stops resolving, so the form died silently and
      stayed dead. Netlify Forms is part of the host that already serves the
      site — there is no second service to keep awake.
    -->
    <form name="contact" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>

    <!-- Mobile Link Fix -->
    <script>
    (function () {
      const SAFE = /^(https?:\/\/|mailto:|tel:|\/|#)/i;
      function normalize(href) {
        if (!href) return href;
        href = href.trim();
        href = href.replace(/^project:/i, '/project/');
        href = href.replace(/^(app|intent):\/\/?/i, '/');
        href = href.replace(/^\/\/(project)/i, '/$1');
        href = href.replace(/^http:barskydesign\.pro/i, 'https://barskydesign.pro');
        if (/^[a-z0-9.-]+\.[a-z]{2,}([\/?#].*)?$/i.test(href)) {
          href = 'https://' + href;
        }
        if (/^project(\/|$)/i.test(href)) href = '/' + href;
        return href;
      }

      function normalizeLinks() {
        document.querySelectorAll('a[href]').forEach(a => {
          const fixed = normalize(a.getAttribute('href'));
          if (fixed) a.setAttribute('href', fixed);
          if (/^\//.test(fixed || '')) a.setAttribute('target', '_self');
        });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', normalizeLinks);
      } else {
        normalizeLinks();
      }

      const observer = new MutationObserver(normalizeLinks);
      observer.observe(document.body, { childList: true, subtree: true });

      document.addEventListener('click', (e) => {
        const a = e.target.closest('a[href]');
        if (!a) return;
        const href = a.getAttribute('href') || '';
        if (!SAFE.test(href)) return;
        if (/^https?:\/\//i.test(href)) return;
        if (href.startsWith('/')) {
          e.preventDefault();
          window.location.assign(href);
        }
      }, true);
    })();
    </script>
