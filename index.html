
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="google-site-verification" content="qtRvrh4E-LoAlYx6yBRup7DFikg4HyeElgRyi-ESsPE" />
    
    <!-- Per-page title, description, canonical, og:*, twitter:* are rendered dynamically
         by UnifiedSEO via react-helmet-async. Keep only sitewide author/robots here. -->
    <meta name="author" content="Hiram Barsky">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">

    <!-- Additional SEO -->
    <meta name="keywords" content="UX Designer, Product Designer, AI Designer, Design Strategy, User Experience, Fintech Design, Healthcare UX, Clifton NJ">
    <meta name="geo.region" content="US-NJ">
    <meta name="geo.placename" content="Clifton, New Jersey">
    
    <!-- Favicons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/" />
    
    <!-- Performance & Critical Resource Hints. No Google Fonts preconnect: the
         typefaces (Fraunces, IBM Plex Sans) are self-hosted from /fonts. -->
    
    <!-- Critical CSS -->
    <style>
      .hero-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
      .hero-loading { opacity: 0; animation: fade-in-fast 0.3s ease-out forwards; }
      @keyframes fade-in-fast { to { opacity: 1; } }
      img[loading="eager"] { content-visibility: auto; }
    </style>

    <!-- SEO meta tags dynamically rendered by React Helmet in UnifiedSEO.tsx -->

    <!-- LocalBusiness JSON-LD.
         @id matches ORG_ID in src/utils/seo/structuredDataUtils.ts so this node and
         the runtime Organization merge into one entity instead of floating apart.
         name was "Barsky Design" here and "Hiram Barsky Design" in the runtime
         schema — two names for one business. openingHours is deliberately absent:
         inventing hours for a remote practice is worse than omitting the field. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "@id": "https://barskydesign.pro/#organization",
      "name": "Barsky Design",
      "image": "https://barskydesign.pro/images/hiram-barsky-headshot.webp",
      "logo": "https://barskydesign.pro/logo.png",
      "url": "https://barskydesign.pro/",
      "telephone": "+1-201-668-3324",
      "email": "hbarsky01@gmail.com",
      "priceRange": "$$",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Clifton",
        "addressRegion": "NJ",
        "addressCountry": "US"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 40.8584,
        "longitude": -74.1638
      },
      "founder": { "@id": "https://barskydesign.pro/#hiram-barsky" },
      "areaServed": "US",
      "sameAs": [
        "https://www.linkedin.com/in/hiram-barsky",
        "https://github.com/hbarsky00"
      ]
    }
    </script>

    <!-- WebSite JSON-LD. The SearchAction was removed: it advertised
         /?s={search_term_string} and this site has no search, so it described a
         feature that does not exist. Google also retired the sitelinks searchbox
         in November 2023. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "@id": "https://barskydesign.pro/#website",
      "name": "Barsky Design",
      "description": "Product design and front-end development for SaaS, web and mobile products.",
      "url": "https://barskydesign.pro/",
      "inLanguage": "en-US",
      "publisher": { "@id": "https://barskydesign.pro/#organization" }
    }
    </script>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VYKW0Y9K0T"></script>
    <script src="/js/gtag-init.js"></script>
    
    
    <!-- Google Fonts removed. It requested Space Grotesk, Outfit and Inter — none
         of which this site uses any more, since the fonts were self-hosted — and the
         enforced CSP (style-src 'self' 'unsafe-inline') blocked the stylesheet on
         every page load, so it was two failed requests and two console errors for
         typefaces nothing referenced. The onload="" attribute was blocked too. -->
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json">
    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />
    
    <!-- Additional meta tags -->
    <meta name="theme-color" content="#3B82F6" />
    <meta name="language" content="English" />
</head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Mobile Link Fix -->
    <script src="/js/link-normalizer.js" defer></script>
  </body>
</html>
