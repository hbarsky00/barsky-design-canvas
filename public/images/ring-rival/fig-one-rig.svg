<text x="40" y="46" font-size="24" font-weight="600" fill="#231E1A" text-anchor="start" font-family='"Fraunces", ui-serif, Georgia, serif'>One rig, every fighter</text>
<text x="40" y="74" font-size="15" font-weight="400" fill="#5B6068" text-anchor="start">A shared skeleton and one proportions sheet per fighter. The fight code counts on eight poses; each fighter gets one of their own.</text>
