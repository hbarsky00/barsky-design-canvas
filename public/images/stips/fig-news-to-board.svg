<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 400" width="1150" height="400" font-family='"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif'>
<rect width="1150" height="400" fill="#FBFAF8"/>
<text x="40" y="46" font-size="24" font-weight="600" fill="#231E1A" text-anchor="start" font-family='"Fraunces", ui-serif, Georgia, serif'>News to board</text>
<text x="40" y="74" font-size="15" font-weight="400" fill="#5B6068" text-anchor="start">A scheduled job turns headlines into markets. One line in the prompt decides which ones survive.</text>
<line x1="90.0" y1="170" x2="1060.0" y2="170" stroke="#5B6068" stroke-width="2"/>
<circle cx="90.0" cy="170" r="9" fill="#F6EBDF" stroke="#B04321" stroke-width="2"/>
<text x="90.0" y="113" font-size="14.5" font-weight="400" fill="#231E1A" text-anchor="middle">News, on a</text>
<text x="90.0" y="130" font-size="14.5" font-weight="400" fill="#231E1A" text-anchor="middle">schedule</text>
<circle cx="284.0" cy="170" r="9" fill="#FFFFFF" stroke="#231E1A" stroke-width="2"/>
<text x="284.0" y="113" font-size="14.5" font-weight="400" fill="#231E1A" text-anchor="middle">AI drafts</text>
<text x="284.0" y="130" font-size="14.5" font-weight="400" fill="#231E1A" text-anchor="middle">markets</text>
<circle cx="478.0" cy="170" r="11" fill="#B04321"/><circle cx="478.0" cy="170" r="4" fill="#FFFFFF"/>
<text x="478.0" y="113" font-size="14.5" font-weight="600" fill="#231E1A" text-anchor="middle">Today&#x27;s date is</text>
<text x="478.0" y="130" font-size="14.5" font-weight="600" fill="#231E1A" text-anchor="middle">in the prompt</text>
<circle cx="672.0" cy="170" r="9" fill="#F6EBDF" stroke="#B04321" stroke-width="2"/>
<text x="672.0" y="130" font-size="14.5" font-weight="400" fill="#231E1A" text-anchor="middle">On the board</text>
<circle cx="866.0" cy="170" r="9" fill="#F6EBDF" stroke="#B04321" stroke-width="2"/>
<text x="866.0" y="113" font-size="14.5" font-weight="400" fill="#231E1A" text-anchor="middle">Buy Yes or No,</text>
<text x="866.0" y="130" font-size="14.5" font-weight="400" fill="#231E1A" text-anchor="middle">play money</text>
<circle cx="1060.0" cy="170" r="9" fill="#F6EBDF" stroke="#B04321" stroke-width="2"/>
<text x="1060.0" y="96" font-size="14.5" font-weight="400" fill="#231E1A" text-anchor="middle">Resolves; a</text>
<text x="1060.0" y="113" font-size="14.5" font-weight="400" fill="#231E1A" text-anchor="middle">right share pays</text>
<text x="1060.0" y="130" font-size="14.5" font-weight="400" fill="#231E1A" text-anchor="middle">$1</text>
<line x1="478.0" y1="182" x2="478.0" y2="260" stroke="#5B6068" stroke-width="2" stroke-dasharray="4 4"/>
<circle cx="478.0" cy="270" r="9" fill="#FBFAF8" stroke="#5B6068" stroke-width="2" stroke-dasharray="3 2"/>
<text x="478.0" y="304" font-size="14.5" font-weight="400" fill="#5B6068" text-anchor="middle">Close date already past: dropped</text>
<text x="496.0" y="230" font-size="13" font-weight="400" fill="#5B6068" text-anchor="start">no clock in the model</text>
<text x="40" y="360" font-size="15" font-weight="400" fill="#5B6068" text-anchor="start">Without the date the model wrote markets that had already closed. Injecting it, then validating the close date, is the whole fix.</text>
</svg>