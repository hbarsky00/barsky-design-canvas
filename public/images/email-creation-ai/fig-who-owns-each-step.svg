<text x="1014.4" y="198" font-size="11.5" font-weight="600" fill="#231E1A" text-anchor="middle" letter-spacing="0.06em">NOT DESIGNED</text>
<text x="40" y="380" font-size="15" font-weight="400" fill="#5B6068" text-anchor="start">Six steps, each with an owner. A step with no owner is where the two weeks go.</text>
<text x="40" y="410" font-size="15" font-weight="400" fill="#5B6068" text-anchor="start">Filled terracotta: the decision this concept turns on.</text>
