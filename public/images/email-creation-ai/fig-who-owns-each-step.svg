<text x="888.0" y="109" font-size="14.5" font-weight="600" fill="#231E1A" text-anchor="middle">appears only once the</text>
<text x="888.0" y="126" font-size="14.5" font-weight="600" fill="#231E1A" text-anchor="middle">checklist passes</text>
