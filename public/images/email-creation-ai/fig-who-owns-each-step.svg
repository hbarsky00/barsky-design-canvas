<text x="716.0" y="318" font-size="14.5" font-weight="400" fill="#231E1A" text-anchor="middle">checklist</text>
<circle cx="888.0" cy="150" r="11" fill="#B04321"/><circle cx="888.0" cy="150" r="4" fill="#FFFFFF"/>
