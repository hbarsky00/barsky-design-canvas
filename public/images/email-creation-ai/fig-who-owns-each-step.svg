<text x="372.0" y="284" font-size="14.5" font-weight="400" fill="#231E1A" text-anchor="middle">Assembles approved</text>
<text x="372.0" y="301" font-size="14.5" font-weight="400" fill="#231E1A" text-anchor="middle">content and the</text>
<text x="372.0" y="318" font-size="14.5" font-weight="400" fill="#231E1A" text-anchor="middle">market&#x27;s compliance</text>
