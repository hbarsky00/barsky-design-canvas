# Public contact form: the browser calls it anonymously with the publishable
# key, which is not a JWT, so gateway JWT verification would reject every real
# submission. The function does its own validation and rate limiting.
[functions.send-contact-email]
verify_jwt = false

[functions.submit-lead]
verify_jwt = false

[functions.dev-mode-changes]
verify_jwt = false

[functions.manage-content]
verify_jwt = false

[functions.seo-handler]
verify_jwt = false