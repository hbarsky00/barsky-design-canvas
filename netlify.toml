# Netlify's Pretty URLs defaults to on, which 301s /project/stips to
# /project/stips/ whenever a directory index exists. Every canonical tag and
# every sitemap entry here uses the slashless form, so Google was crawling the
# canonical URL, receiving a 301, and filing the page under "Page with
# redirect" — which is what put ~15 live pages in that report.
#
# Off means /project/stips serves its index.html directly with a 200. The
# trailing-slash rules further down still catch anyone who arrives with one and
# consolidate them onto the slashless canonical, so there is exactly one URL
# per page and no hop on the one we advertise.
#
# pretty_urls lives under [build.processing.html], not the parent table.
# Put in the parent Netlify silently ignores it — the deploy went green and
# /project/stips kept answering 301, which is how the first attempt at this
# fix looked like it worked.
[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = false

# Emails on form submission live in code, not in a UI toggle.
[functions]
  directory = "netlify/functions"
# 301 Redirects for pages that redirect (fix Google Search Console issues)

# www to non-www redirect (must be first, with force flag)
[[redirects]]
  from = "https://www.barskydesign.pro/*"
  to = "https://barskydesign.pro/:splat"
  status = 301
  force = true


