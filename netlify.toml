[build]
  # npm run build (not a bare `vite build`) so the prebuild (sitemap.xml regeneration)
  # and postbuild (per-route SEO HTML injection) lifecycle hooks in package.json
  # actually run on every deploy instead of only when someone remembers to run them locally.
  command = "npm run build"
  publish = "dist"
  
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
