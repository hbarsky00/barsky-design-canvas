# SPA fallback for all other routes. Mirrors public/_redirects — points at
# spa-shell.html so unmatched URLs do not serve the homepage body.
[[redirects]]
  from = "/*"
  to = "/spa-shell.html"
  status = 200
  
[build]
  # npm run build (not a bare `vite build`) so the prebuild (sitemap.xml regeneration)
  # and postbuild (per-route SEO HTML injection) lifecycle hooks in package.json
  # actually run on every deploy instead of only when someone remembers to run them locally.
  command = "npm run build"
  publish = "dist"
  
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Flagged by the security-headers checker. Referrer-Policy keeps the full
    # URL from leaking to third parties on outbound clicks while still sending
    # the origin, which is what analytics attribution needs. Permissions-Policy
    # denies hardware this site never asks for.
    Referrer-Policy = "strict-origin-when-cross-origin"
    # REPORT-ONLY on purpose. The browser evaluates this and reports what it
    # would have blocked without blocking anything, so a mistake here cannot
    # take the site down. Violations go to the csp-report function. Once the
    # reports come back clean this becomes Content-Security-Policy.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://www.google-analytics.com https://images.unsplash.com; media-src 'self' blob:; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://*.supabase.co; frame-src 'self' https://www.loom.com https://www.youtube-nocookie.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests; report-uri /.netlify/functions/csp-report;"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
