# NOTE: trailing-slash-stripping rules for /project/:x/, /case-studies/:x/,
# and /blog/:x/ used to live here and were REMOVED — confirmed via live
# testing (2026-08-04) that Netlify's redirect matcher treats a named
# placeholder immediately before a literal trailing slash as matching *with
# or without* the slash. For any route with no physical prerendered file
# (e.g. /project/crypto, /project/splittime, /project/qr-code-builder,
# /case-studies/business-management — real React routes, just not in the
# sitemap's "featured" subset), that made `to = "/project/:project"`
# resolve to the exact URL requested: an infinite self-redirect loop, 100%
# unreachable. Prerendered routes never needed this rule (an exact static
# file match always wins over a non-forced redirect), so it was pure
# downside. Do not re-add without testing the no-trailing-slash case live.

# --- Client-only utility routes that must keep serving the SPA with 200 ---

[[redirects]]
  from = "/store/success"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/__seo-check"
  to = "/index.html"
  status = 200

# --- Everything else: serve the SPA shell with a real 404 status. ---
# Every indexable route has a physical prerendered file (served before this
# rule), so only unknown/delisted URLs land here. The React app still renders
# (the catch-all route shows the NotFound page), but crawlers get an honest
# 404 instead of an infinite supply of soft-404s.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # unsafe-inline on script/style is required by this app's architecture:
    # the GA bootstrap + mobile-link-fix run as inline <script> in index.html,
    # and React's style={{...}} attributes (used extensively on promo pages)
    # are inline styles by nature. Neither is easily nonce-able on a static
    # Netlify deploy without per-request edge rendering, so this is a
    # deliberate middle ground rather than a stricter policy that would
    # silently break page styling or analytics.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; media-src 'self' https:; connect-src 'self' https://*.supabase.co https://www.google-analytics.com https://www.googletagmanager.com https://region1.google-analytics.com; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "no-cache"
