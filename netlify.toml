# Netlify's Pretty URLs defaults to on, which 301s /project/stips to
# /project/stips/ whenever a directory index exists. Every canonical tag and
# every sitemap entry here uses the slashless form, so Google was crawling the
# canonical URL, receiving a 301, and filing the page under "Page with
# redirect" — which is what put ~15 live pages in that report.
#
# Off means /project/stips serves its index.html directly with a 200. The
# trailing-slash rules further down still catch anyone who arrives with one and
# consolidate them onto the slashless canonical, so there is exactly one URL
# per page and no hop on the one we advertise.
#
# pretty_urls lives under [build.processing.html], not the parent table.
# Put in the parent Netlify silently ignores it — the deploy went green and
# /project/stips kept answering 301, which is how the first attempt at this
# fix looked like it worked.
[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = false

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "https://www.barskydesign.pro/*"
  to = "https://barskydesign.pro/:splat"
  status = 301
  force = true

# shell for these, so without redirects they answer 200 with a client-rendered
# "Post Not Found" — a soft-404 that keeps them indexed. Send them to /blog.
[build]
  # npm run build (not a bare `vite build`) so the prebuild (sitemap.xml regeneration)
  # and postbuild (per-route SEO HTML injection) lifecycle hooks in package.json
  # actually run on every deploy instead of only when someone remembers to run them locally.
  command = "npm run build"
  publish = "dist"
  
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Flagged by the security-headers checker. Referrer-Policy keeps the full
    # URL from leaking to third parties on outbound clicks while still sending
    # the origin, which is what analytics attribution needs. Permissions-Policy
    # denies hardware this site never asks for.
    Referrer-Policy = "strict-origin-when-cross-origin"
    # ENFORCED as of 2026-08-24. It ran report-only first, and was verified
    # clean in a real browser across the homepage, /contact and a case study:
    # zero "Refused to load" violations. The only CSP console message was
    # 'upgrade-insecure-requests is ignored when delivered in a report-only
    # policy', which enforcing this is precisely what fixes.
    # Google's font origins were dropped from style-src/font-src when the fonts
    # were self-hosted, and cdn.loom.com never needed an entry once those
    # thumbnails moved in-house.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://www.google-analytics.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://www.google-analytics.com https://images.unsplash.com; media-src 'self' blob:; connect-src 'self' https://challenges.cloudflare.com https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; frame-src 'self' https://www.loom.com https://www.youtube-nocookie.com https://challenges.cloudflare.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests; report-uri /.netlify/functions/csp-report;"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Client-only routes with no prerendered body. They have to stay 200 because the
# SPA renders them, but a 200 with an empty shell is a soft 404 if it ever gets
# discovered, so tell crawlers not to index them.
[[headers]]
  for = "/store/success"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
